services:
  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    ports:
      - "8787:8787"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
