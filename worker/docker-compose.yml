services:
  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      PORT: 8787
      WORK_DIR: /tmp/shortforge
    volumes:
      - worker-tmp:/tmp/shortforge
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  worker-tmp:
